# Documentation project for OracleD.jl, built with Documenter.jl.
#
# The top-level `Project.toml` lists `docs/` as a workspace member
# (`[workspace] projects = ["docs"]`), so this environment can use the
# `OracleD` package from the repository root as well as `Documenter`.

[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
OracleD = "9eb4966d-a507-473c-abf9-23f58258070d"

[compat]
Documenter = "1"
OracleD = "1.1.0"
julia = "1.12"
